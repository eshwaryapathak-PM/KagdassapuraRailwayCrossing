<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Design lives in the centred 1200x630 safe band (y 285..915) -->
  <g transform="translate(0,285)">
    <rect x="0" y="0" width="1200" height="8" fill="#00C896"/>

    <!-- Railway crossing sign (crossbuck + signal) -->
    <g transform="translate(96,150)">
      <circle cx="80" cy="80" r="78" fill="#131C2E" stroke="#2A3A55" stroke-width="3"/>
      <g stroke="#C8D6E8" stroke-width="12" stroke-linecap="round">
        <line x1="34" y1="46" x2="126" y2="114"/>
        <line x1="126" y1="46" x2="34" y2="114"/>
      </g>
      <circle cx="52" cy="132" r="10" fill="#FF4444"/>
      <circle cx="108" cy="132" r="10" fill="#FF4444"/>
    </g>

    <!-- Text block -->
    <g transform="translate(320,120)" font-family="Helvetica, Arial, sans-serif">
      <text x="0" y="0" fill="#5E7090" font-size="26" font-weight="600" letter-spacing="4">LIVE GATE STATUS</text>
      <text x="0" y="80" fill="#F1F5FB" font-size="74" font-weight="800">Kaggadasapura</text>
      <text x="0" y="145" fill="#C8D6E8" font-size="50" font-weight="600">Railway Crossing</text>
      <text x="0" y="205" fill="#7C8CA5" font-size="29">Is it open or closed? Know before you go.</text>

      <g transform="translate(0,245)">
        <rect x="0" y="0" width="150" height="52" rx="26" fill="#0E2A22" stroke="#00C896" stroke-width="2"/>
        <circle cx="30" cy="26" r="8" fill="#00C896"/>
        <text x="50" y="34" fill="#00C896" font-size="24" font-weight="700">OPEN</text>
        <rect x="170" y="0" width="168" height="52" rx="26" fill="#2A1414" stroke="#FF4444" stroke-width="2"/>
        <circle cx="200" cy="26" r="8" fill="#FF4444"/>
        <text x="220" y="34" fill="#FF4444" font-size="24" font-weight="700">CLOSED</text>
      </g>
    </g>

    <text x="96" y="558" fill="#5E7090" font-family="Menlo, monospace" font-size="25">
      eshwaryapathak-pm.github.io/KagdassapuraRailwayCrossing
    </text>
    <text x="96" y="598" fill="#3A4F6A" font-family="Helvetica, Arial, sans-serif" font-size="20">
      BYPL &#8596; BLRR  ·  Bengaluru&#8211;Salem line  ·  refreshes every 30 min
    </text>
  </g>
</svg>
